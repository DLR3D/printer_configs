#####
# _PRINTER_CONFIG
#####
[gcode_macro _PRINTER_CONFIG]
variable_x_bed_size: 400
variable_y_bed_size: 400
variable_x_park_position: -28
variable_y_park_position: 400
variable_x_wiper_center: -28
variable_y_wiper_center: 15
variable_x_wiper_size: 8
variable_y_wiper_size: 37
variable_wiper_use_xy: True
variable_ptfe_length: 1600
description: Stores printer specific info for other macros
gcode:
  #Empty

#####
# HANDLE_CHAMBER
#####
[gcode_macro _MANAGE_CHAMBER]
description: Manage chamber related control
gcode:
  # Macro parameters
  {% set chamber_temp = params.CHAMBER_TEMP|default(0)|int %}
  
  SET_TEMPERATURE_FAN_TARGET temperature_fan="Chamber" target={chamber_temp}

  #Enable chamber circulator in min speed
  SET_FAN_SPEED FAN=Chamber_Recirculator SPEED=0.20

#####
# SAVE_DISABLE_FILAMENT_SENSOR
#####
[gcode_macro _SAVE_DISABLE_FILAMENT_SENSOR]
variable_motion_sensor_state: 1
variable_presence_sensor_state: 1
description: Save current filament sensor state and disables the filament sensors for sensitive processes. Can be set to throw and error if no filament is present using CHECK_FILAMENT=1
gcode:
  # Macro parameters
  {% set check_filament = params.CHECK_FILAMENT|default(0)|int %}

  # If Duet Filament Monitor
  SET_GCODE_VARIABLE MACRO=_SAVE_DISABLE_FILAMENT_SENSOR VARIABLE=motion_sensor_state VALUE={ printer["filament_motion_sensor Duet_Filament_Monitor"].enabled|int }

  SET_FILAMENT_SENSOR SENSOR=Duet_Filament_Monitor ENABLE=0


#####
# RESTORE_FILAMENT_SENSOR
#####
[gcode_macro _RESTORE_FILAMENT_SENSOR]
description: Restores filament sensor state before being disabled
gcode:
  SET_FILAMENT_SENSOR SENSOR=Duet_Filament_Monitor ENABLE={printer['gcode_macro _SAVE_DISABLE_FILAMENT_SENSOR'].motion_sensor_state}


#####
# Aux functions for update
#####
[gcode_shell_command update_printer_config]
command: bash ~/printer_configs/update.sh
timeout: 30
verbose: True

[gcode_shell_command update_klipper_addons]
command: bash ~/klipper_addon_de/update.sh
timeout: 30
verbose: True

[gcode_macro FINISH_UPDATE]
description: Restores filament sensor state before being disabled
gcode:
  RUN_SHELL_COMMAND CMD=update_printer_config
  RUN_SHELL_COMMAND CMD=update_klipper_addons