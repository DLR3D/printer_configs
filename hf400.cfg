#
# Homefront Manufacturing
#
# HF400 config

[virtual_sdcard]
path:~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume] 

[display_status]

[respond]

[thermistor duet_3950_thermistor]
temperature1: 20.1
resistance1: 82500
temperature2: 81
resistance2: 12493
temperature3: 138.5
resistance3: 2649

# Pins for reference, Duet 6HC v1.02 board:
# Driver Step Pins - 0:PC18 1:PC16 2:PC28 3:PC1  4:PC4 5:PC9
# Driver Dir Pins  - 0:PB5  1:PD10 2:PA4  3:PA22 4:PC3 5:PD14
# Driver Enable - !PA9
# Driver CS - PD17
# Thermistor Pins - TEMP0:PC15 TEMP1:PC29 TEMP2:PC30 TEMP3:PC31
# Pullup Resistor - 2200
# Vssa Sense:PC13 | Vref Sense:PC0
# Current Sense resistor for drivers - 0.05ohm
# SPI lines:{PC25} -> SPIMosi:PC27 SPIMiso:PC26 SPISCLK:PC24
# Vin Monitor:PA20
# CAN Pins - TX0:PB2 RX0:PB3 TX1:PD12 RX1:PC12
# Heaters - Out0:PA7 Out1:PA24 Out2:PA16 Out3:PA11
# Fan outputs - Out4:PA15 Out5:PC5 Out6:PA8 Out7:PC11 Out8:PC8 Out9:PA12 | Out9 is shared with VFD_Out
# Tach Pins for Fans - Out4.Tach:PC7 Out5.Tach:PD23 Out6.Tach:PA1
# GPIO_out - IO0:PD26 IO1:PD16 IO2:PD27 IO3:PA3 IO4:PE0  IO5:PD21 IO6:PA0  IO7:PD23 IO8:PE1
# GPIO_in -  IO0:PD25 IO1:PD15 IO2:PD28 IO3:PE5 IO4:PD30 IO5:PA19 IO6:PA18 IO7:PA17 IO8:PE3
# Driver Diag - 0:PD29 1:PC17 2:PD13 3:PC2 4:PD31 5:PC10

[board_pins 6HC]
aliases:
	# "Motor 0"
	M0_step_pin=PC18,
	M0_dir_pin=PB5,
	M0_endstop_pin=PD25,
	# "Motor 1"
	M1_step_pin=PC16,
	M1_dir_pin=PD10,
	M1_endstop_pin=PD15,
	# "Motor 2"
	M2_step_pin=PC28,
	M2_dir_pin=PA4,
	M2_endstop_pin=PD28,
	# "Motor 3"
	M3_step_pin=PC1,
	M3_dir_pin=PA22,
	M3_endstop_pin=PE5,
	# "Motor 4"
	M4_step_pin=PC4,
	M4_dir_pin=PC3,
	M4_endstop_pin=PD30,
	# "Motor 5"
	M5_step_pin=PC9,
	M5_dir_pin=PD14,
	M5_endstop_pin=PA19,

	TMC_SPI_CS=PD17,
	TMC_ENABLE_PIN=PA9,
    stepper_spi_mosi_pin=PC27,
	stepper_spi_miso_pin=PC26,
	stepper_spi_sclk_pin=PC24,

	#----------------------------------------------- GENERAL PINS -----------------------------------------------
	OUT0_heater_pin=PA7,
    OUT1_heater_pin=PA24,
	OUT2_heater_pin=PA16,
    OUT3_heater_pin=PA11,
    TEMP0_sensor_pin=PC15,
    TEMP1_sensor_pin=PC29,
	TEMP2_sensor_pin=PC30,
    TEMP3_sensor_pin=PC31,
	
	OUT4_fan_pin=PA15,
    OUT5_fan_pin=PC5,
	OUT6_fan_pin=PA8,
	OUT7_fan_pin=PC11,
    OUT8_fan_pin=PC8,
	OUT9_fan_pin=PA12,
	OUT4_tach_pin=PC7,
    OUT5_tach_pin=PD23,
	OUT6_tach_pin=PA1,

    IO_0_OUT= PD26,
    IO_1_OUT= PD16,
    IO_2_OUT= PD27,
    IO_3_OUT= PA3,
    IO_0_IN= PD25,
    IO_1_IN= PD15,
    IO_2_IN= PD28

[output_pin TMC_ENABLE]
pin:TMC_ENABLE_PIN
value: 0

# COREXY A MOTOR
[stepper_x]
step_pin:   M2_step_pin
dir_pin:    M2_dir_pin
#enable_pin: !TMC_ENABLE_PIN
endstop_pin:  toolboard:IO_2_IN
homing_retract_dist: 2
homing_speed: 200
second_homing_speed: 25
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
position_min: -33
position_endstop: -33
position_max: 425

[tmc5160 stepper_x]
cs_pin: TMC_SPI_CS
spi_bus: usart1
chain_position: 3
chain_length: 6
interpolate: False
sense_resistor: 0.05
run_current: 1.6

# COREXY B MOTOR
[stepper_x1]
step_pin:   M0_step_pin
dir_pin:    M0_dir_pin
#enable_pin: !TMC_ENABLE_PIN
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40

[tmc5160 stepper_x1]
cs_pin: TMC_SPI_CS
chain_position: 1
chain_length: 6
interpolate: False
sense_resistor: 0.05
run_current: 1.6

# HYBRID Y0 MOTOR
[stepper_y]
step_pin:     M1_step_pin
dir_pin:      !M1_dir_pin
#enable_pin:  !TMC_ENABLE_PIN
endstop_pin:  ^IO_0_IN
homing_retract_dist: 2
homing_speed: 200
second_homing_speed: 25
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
homing_speed: 200
position_min: -4
position_max: 411
position_endstop: 411

[tmc5160 stepper_y]
cs_pin: TMC_SPI_CS
chain_position: 2
chain_length: 6
interpolate: False
sense_resistor: 0.05
run_current: 1.6

# HYBRID Y1 MOTOR
[stepper_y1]
step_pin:     M3_step_pin
dir_pin:      M3_dir_pin
#enable_pin:  !TMC_ENABLE_PIN
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40

[tmc5160 stepper_y1]
cs_pin: TMC_SPI_CS
chain_position: 4
chain_length: 6
interpolate: False
sense_resistor: 0.05
run_current: 1.6

[multi_pin LED_OUTPUT]
pins:OUT8_fan_pin,OUT9_fan_pin

[output_pin Enclosure_Light]
pin: multi_pin:LED_OUTPUT
pwm: True
cycle_time: 0.0001
value: 0.5

[temperature_fan Chamber]
pin: OUT7_fan_pin
max_power: 1.0
min_speed: 0.0
shutdown_speed: 0.0
kick_start_time: 1.0
cycle_time:0.01
sensor_type: PT1000
sensor_pin: TEMP1_sensor_pin
pullup_resistor: 1715 # Value optimized to correct PT1000 reading errors on klipper
min_temp: 0
max_temp: 65
target_temp: 35.0
control: pid
pid_Kp: 3
pid_Ki: 0.5
pid_Kd: 5
gcode_id: C

[temperature_sensor Duet3_6HC]
sensor_type: temperature_mcu

[controller_fan controller_fan]
pin: OUT6_fan_pin

#------------------------------------------------- AUX EXTRUDER -------------------------------------------------
# The extruder motor used for pushing filament through the PTFE tube up to the toolhead
#------------------------------------------------------------------------------------------------------------
[extruder_stepper e1_aux]
step_pin:    M4_step_pin
dir_pin:    M4_dir_pin
#enable_pin: !TMC_ENABLE_PIN
microsteps: 64
rotation_distance: 4.84
full_steps_per_rotation: 200
extruder: extruder

[tmc5160 extruder_stepper e1_aux]
cs_pin: TMC_SPI_CS
chain_position: 5
chain_length: 6
interpolate: False
sense_resistor: 0.05
run_current: 0.4

[filament_motion_sensor Duet_Filament_Monitor]
switch_pin: ^IO_2_IN
#detection_length: 2 #0.5mm sensor precision (below 2mm false positives appear)
detection_length: 10 # attempt for larger nozzle and high flow false positives
extruder: extruder
pause_on_runout: False
runout_gcode:
    RESPOND TYPE=command MSG="Filament monitor runout, pausing."
    PAUSE

#
# Duet 1LC toolboard
#

[board_pins 1LC]
mcu: toolboard
aliases:
	# "Motor 0"
	M0_step_pin=PA27,
	M0_dir_pin=PA28,
    M0_enable_pin=PB2,
	M0_uart_pin=PA20,
    M0_tx_pin=PA22,

	#----------------------------------------------- GENERAL PINS -----------------------------------------------
	OUT0_heater_pin=PA11,
    OUT1_fan_pin=PA10,
    OUT1_tach_pin=PA13,
	OUT2_fan_pin=PB11,
    OUT2_tach_pin=PB10,
    
    TEMP0_sensor_pin=PB9,
    TEMP1_sensor_pin=PA2,

    i2c_tx_pin=PA16,
    i2c_clk_pin=PA17,

    IO_0_OUT=PA12,
    IO_0_IN=PA9,
    IO_1_IN=PA21,
    IO_2_IN=PA18,
    IO_3_IN=PA1

[extruder]
step_pin: toolboard:M0_step_pin
dir_pin: toolboard:M0_dir_pin
enable_pin: !toolboard:M0_enable_pin
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 8
nozzle_diameter: 1.400
filament_diameter: 1.750
max_extrude_only_distance: 1800.0
heater_pin: toolboard:OUT0_heater_pin
sensor_type: PT1000
pullup_resistor: 2288 #Correct resistance measurement
sensor_pin: toolboard:TEMP0_sensor_pin
min_temp: 0
max_temp: 450
min_extrude_temp: 0
max_extrude_cross_section: 100
pwm_cycle_time: 0.001

[tmc2209 extruder]
uart_pin: toolboard:M0_uart_pin
tx_pin: toolboard:M0_tx_pin
interpolate: False
sense_resistor: 0.091
run_current: 0.4

[samd_sercom sercom_i2c]
sercom: sercom1
tx_pin: toolboard:i2c_tx_pin
clk_pin: toolboard:i2c_clk_pin

[lis3dh toolhead_accel]
i2c_mcu: toolboard
i2c_bus: sercom1
axes_map: z, x, y

[resonance_tester]
accel_chip_x: lis3dh toolhead_accel
accel_chip_y: lis3dh toolhead_accel
probe_points:
	200,200,10
sweeping_period: 1.2

[fan]
pin: !toolboard:OUT1_fan_pin
tachometer_pin: toolboard:OUT1_tach_pin
max_power: 1
shutdown_speed: 0.0
#cycle_time: 0.01
cycle_time: 0.00005
tachometer_ppr: 2
tachometer_poll_interval: 0.00005

[heater_fan toolhead_cooling_fan]
pin: toolboard:OUT2_fan_pin
max_power: 1
cycle_time: 0.0001
shutdown_speed: 1.0
#tachometer_pin: toolboard:OUT2_tach_pin
#tachometer_ppr: 2
#tachometer_poll_interval: 0.00005

#
# Duet 3HC expansion
#

[temperature_sensor Duet3_3HC]
sensor_type: temperature_mcu
sensor_mcu: 3hc

[board_pins 3HC]
mcu: 3hc
aliases:
	# "Motor 0"
	M0_step_pin=PA25,
	M0_dir_pin=PA23,
    M0_endstop_pin=PA6, #I0_0

    # "Motor 1"
	M1_step_pin=PA27,
	M1_dir_pin=PC28,
    M1_endstop_pin=PC2, #I0_1

    # "Motor 2"
	M2_step_pin=PA1,
	M2_dir_pin=PA0,
    M2_endstop_pin=PC0, #I0_2

    TMC_SPI_CS=PB22,
	TMC_ENABLE_PIN=PB23,
    stepper_spi_mosi_pin=PB24,
	stepper_spi_miso_pin=PC25,
	stepper_spi_sclk_pin=PB25,

	#----------------------------------------------- GENERAL PINS -----------------------------------------------
	OUT0_heater_pin=PA18,
    OUT1_heater_pin=PA19,
    OUT2_heater_pin=PA24,
    OUT3_fan_pin=PB9,
    OUT4_fan_pin=PA5,
	OUT5_fan_pin=PB8,
    OUT6_fan_pin=PA11,
    OUT7_fan_pin=PB11,
	OUT8_fan_pin=PA13,
    
    TEMP0_sensor_pin=PC3,
    TEMP1_sensor_pin=PB8,
    TEMP2_sensor_pin=PB7,

    i2c_tx_pin=PA16,
    i2c_clk_pin=PA17

[samd_sercom sercom0]
sercom: sercom0
tx_pin: 3hc:stepper_spi_mosi_pin
rx_pin: 3hc:stepper_spi_miso_pin
clk_pin: 3hc:stepper_spi_sclk_pin

[stepper_z]
step_pin:    3hc:M2_step_pin
dir_pin:    !3hc:M2_dir_pin
enable_pin: !3hc:TMC_ENABLE_PIN
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 4
position_min: -5
homing_speed: 10
endstop_pin: probe:z_virtual_endstop
position_max: 430
#position_endstop: 0

[tmc5160 stepper_z]
cs_pin: 3hc:TMC_SPI_CS
spi_bus: sercom0
#spi_software_sclk_pin: 3hc:stepper_spi_sclk_pin
#spi_software_mosi_pin: 3hc:stepper_spi_mosi_pin
#spi_software_miso_pin: 3hc:stepper_spi_miso_pin
chain_position: 3
chain_length: 3
interpolate: False
sense_resistor: 0.05
run_current: 1.6

[stepper_z1]
step_pin:    3hc:M1_step_pin
dir_pin:    !3hc:M1_dir_pin
enable_pin: !3hc:TMC_ENABLE_PIN
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 4

[tmc5160 stepper_z1]
cs_pin: 3hc:TMC_SPI_CS
chain_position: 2
chain_length: 3
interpolate: False
sense_resistor: 0.05
run_current: 1.6

[stepper_z2]
step_pin:    3hc:M0_step_pin
dir_pin:    !3hc:M0_dir_pin
enable_pin: !3hc:TMC_ENABLE_PIN
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 4

[tmc5160 stepper_z2]
cs_pin: 3hc:TMC_SPI_CS
chain_position: 1
chain_length: 3
interpolate: False
sense_resistor: 0.05
run_current: 1.6

[gcode_button E_Stop]
pin: ^IO_1_IN
press_gcode:
  { action_emergency_stop("Emergency! E-stop button pressed!") }
  
[fan_generic Chamber_Recirculator]
pin: !OUT4_fan_pin
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.001
off_below:0.2
enable_pin: OUT5_fan_pin

[heater_bed]
heater_pin: OUT0_heater_pin
sensor_type: duet_3950_thermistor
sensor_pin: TEMP0_sensor_pin
pullup_resistor: 2288
min_temp: 0
max_temp: 130
pwm_cycle_time: 0.02 # 50Hz AC
#pwm_cycle_time: 0.0166 # 60Hz AC

[z_tilt_de]
speed: 600
retries: 10
retry_tolerance: 0.01
z_positions:
    -5,-5
    200,405
    405,-5
points:
    30,30
    200,350
    370,30

[bed_mesh]
horizontal_move_z: 2
mesh_min: 30,30
mesh_max:370,350
probe_count: 40,40
fade_start: 1.0
fade_end: 10.0
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: .2
speed: 600

[printer]
kinematics: ratos_hybrid_corexy
max_velocity: 800
max_accel: 20000
max_z_velocity: 30
max_z_accel: 500

[beacon]
x_offset: 0 
y_offset: 20
speed: 15.
lift_speed: 80.
contact_max_hotend_temperature: 155

[input_shaper]

[safe_z_home]
home_xy_position: 200,190
speed: 600.0
z_hop: 5
z_hop_speed: 20.0

[exclude_object]

[force_move]
enable_force_move: True

[autotune_tmc stepper_x]
motor: ldo-42sth48-2504ah
voltage: 24
[autotune_tmc stepper_x1]
motor: ldo-42sth48-2504ah
voltage: 24
[autotune_tmc stepper_y]
motor: ldo-42sth48-2504ah
voltage: 24
[autotune_tmc stepper_y1]
motor: ldo-42sth48-2504ah
voltage: 24

[autotune_tmc stepper_z]
motor: ldo-42sth48-2504ah
voltage: 24
tuning_goal: performance
[autotune_tmc stepper_z1]
motor: ldo-42sth48-2504ah
voltage: 24
tuning_goal: performance
[autotune_tmc stepper_z2]
motor: ldo-42sth48-2504ah
voltage: 24
tuning_goal: performance

[include hf400_macros.cfg]
[include hf_macros.cfg]

[beacon_adaptive_heat_soak]
[beacon_true_zero_correction]